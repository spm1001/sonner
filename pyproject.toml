[project]
name = "sonner"
version = "0.1.0"
description = "Ring a repo, and a Claude answers — repo-addressed messaging for Claude Code sessions"
requires-python = ">=3.11"
license = "MIT"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
